packages:
  - "packages/*"
  - "apps/admin-web"
  - "apps/marketing-web"
  - "apps/cardscanfox-web"
  - "apps/website-service"
  - "apps/workers-api"
allowBuilds:
  esbuild: true
  sharp: false
  workerd: true

minimumReleaseAgeExclude:
  - miniflare@4.20260630.0
  - wrangler@4.106.0

# 标准 pnpm 字段：CI（plain pnpm）据此放行必要构建脚本，与上方本地 allowBuilds 对齐。
onlyBuiltDependencies:
  - esbuild
  - workerd

# 上游固定旧版本的安全补丁；仅覆盖实际引入漏洞的父包。
overrides:
  "@esbuild-kit/core-utils@3.3.2>esbuild": "0.25.12"
  "miniflare@4.20260630.0>sharp": "0.35.5"
  "miniflare@4.20260630.0>undici": "7.30.1"
