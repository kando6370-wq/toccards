<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Choose the ETB edition first.</title><desc id="desc">Regular Delta Reign ETB: nine packs and one Kyogre promo. Pokémon Center ETB: eleven packs and two Kyogre promos, one with Center logo. Retailer gift promotions are separate from sealed-box contents.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="720" rx="0" fill="#f8f9f6" stroke="none"/><rect x="0" y="0" width="12" height="720" rx="0" fill="#416b40" stroke="none"/><text x="54" y="55" font-size="23" font-weight="700" fill="#416b40" >CardScanFox</text><text x="54" y="123" font-size="43" font-weight="700" fill="#1b231d" >Choose the ETB edition first.</text><text x="54" y="170" font-size="23" font-weight="400" fill="#626b64" >Pack count, included promos and retailer gifts are different facts.</text><rect x="54" y="220" width="525" height="254" rx="12" fill="#ffffff" stroke="#dfe4da"/><text x="79" y="265" font-size="29" font-weight="700" fill="#1b231d" >Regular ETB</text><text x="79" y="347" font-size="74" font-weight="700" fill="#416b40" >9</text><text x="174" y="340" font-size="24" font-weight="400" fill="#1b231d" >packs</text><text x="347" y="347" font-size="74" font-weight="700" fill="#416b40" >1</text><text x="428" y="340" font-size="22" font-weight="400" fill="#1b231d" >promo</text><text x="79" y="431" font-size="22" font-weight="400" fill="#626b64" >Full-art foil Kyogre</text><rect x="621" y="220" width="525" height="254" rx="12" fill="#ffffff" stroke="#dfe4da"/><text x="646" y="265" font-size="29" font-weight="700" fill="#1b231d" >Pokémon Center ETB</text><text x="646" y="347" font-size="74" font-weight="700" fill="#416b40" >11</text><text x="741" y="340" font-size="24" font-weight="400" fill="#1b231d" >packs</text><text x="914" y="347" font-size="74" font-weight="700" fill="#416b40" >2</text><text x="995" y="340" font-size="22" font-weight="400" fill="#1b231d" >promos</text><text x="646" y="431" font-size="22" font-weight="400" fill="#626b64" >One Kyogre has the Center logo</text><text x="54" y="531" font-size="28" font-weight="700" fill="#1b231d" >Three different promo situations</text><text x="54" y="577" font-size="22" font-weight="700" fill="#1b231d" >Included Kyogre</text><text x="416" y="577" font-size="22" font-weight="700" fill="#1b231d" >Center-logo Kyogre</text><text x="811" y="577" font-size="22" font-weight="700" fill="#1b231d" >Retailer gift</text><text x="54" y="610" font-size="20" font-weight="400" fill="#626b64" >Inside the regular box</text><text x="416" y="610" font-size="20" font-weight="400" fill="#626b64" >Included with Center edition</text><text x="811" y="610" font-size="20" font-weight="400" fill="#626b64" >Separate qualifying offer</text><path d="M54 638H1146" stroke="#dfe4da"/><text x="54" y="678" font-size="17" font-weight="400" fill="#626b64" >Sources: Pokémon product showcase, Pokémon Center and US launch announcement · 16 Nov 2026</text></g></svg>