# GitLab CI —— tcg-card monorepo（M0-7）
# TS/Node 侧（ts）+ Dart/Flutter 侧（dart）双 Job。
stages:
  - ts
  - dart

ts:
  stage: ts
  image: node:22.23.4-bookworm-slim
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    - pnpm run build
    - pnpm run type-check
    - pnpm run lint
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/

dart:
  stage: dart
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git libglu1-mesa unzip xz-utils zip
    - curl --fail --location --retry 3 --output /tmp/flutter.tar.xz https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.9-stable.tar.xz
    - echo "25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a  /tmp/flutter.tar.xz" | sha256sum --check --strict
    - tar --extract --xz --file /tmp/flutter.tar.xz --directory /opt
    - export PATH="/opt/flutter/bin:$PATH"
    - git config --global --add safe.directory /opt/flutter
    - flutter --version
    - flutter pub get # 解析根 pub workspace（含 melos dev 依赖）
  script:
    - dart run melos run analyze
    - dart run melos run test
