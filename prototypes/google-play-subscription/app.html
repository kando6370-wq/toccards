<!doctype html>
<html lang="zh-CN">
  <head>
    <!-- 离线评审使用仓库内既有资源 apps/flutter-app/assets/branding/card_ai_mark.svg, apps/flutter-app/assets/subscription/success_trophy_2090_17166.svg。 -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CardScanFox · Android 订阅原型</title>
    <style>
      :root {
        font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
        color: #20342d;
        background: #f0f2ed;
        --lime: #e5ff3b;
        --ink: #11180f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      select {
        font: inherit;
      }
      button,
      a,
      select {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible,
      select:focus-visible {
        outline: 3px solid #28afbb;
        outline-offset: 3px;
      }
      a {
        color: inherit;
      }
      .bar {
        min-height: 64px;
        padding: 12px clamp(18px, 5vw, 84px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #cbd4cb;
        background: #f8f9f5;
      }
      .brand,
      .actionline {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand img {
        width: 27px;
        height: 27px;
        background: #192016;
        border-radius: 7px;
      }
      .brand strong {
        letter-spacing: -0.04em;
      }
      .bar a {
        font-size: 13px;
        font-weight: 650;
        text-decoration: none;
        border-bottom: 1px solid #819689;
      }
      .workspace {
        max-width: 1070px;
        margin: auto;
        display: grid;
        grid-template-columns: minmax(255px, 0.87fr) minmax(360px, 1fr);
        align-items: start;
        gap: clamp(36px, 7.5vw, 105px);
        padding: 35px 36px 44px;
      }
      .controls {
        padding-top: 43px;
      }
      .eyebrow,
      .mono {
        font-family: "IBM Plex Mono", Consolas, monospace;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.09em;
      }
      .eyebrow {
        color: #547261;
      }
      .controls h1 {
        font-size: clamp(30px, 3.5vw, 49px);
        line-height: 1.14;
        letter-spacing: -0.06em;
        margin: 13px 0;
      }
      .intro {
        color: #51665b;
        font-size: 14px;
        line-height: 1.7;
        margin: 0 0 30px;
      }
      .controlbox {
        background: #fafbf7;
        border: 1px solid #cbd5c9;
        border-radius: 17px;
        padding: 18px;
        display: grid;
        gap: 14px;
      }
      .field {
        display: grid;
        gap: 6px;
      }
      .field > span {
        font-size: 12px;
        font-weight: 700;
      }
      .field select {
        width: 100%;
        background: white;
        border: 1px solid #bcc9bf;
        color: #243a31;
        border-radius: 8px;
        padding: 9px;
      }
      .reset {
        justify-self: start;
        border: 0;
        background: none;
        padding: 2px 0;
        color: #28654b;
        text-decoration: underline;
        font-size: 13px;
      }
      .legend {
        margin-top: 18px;
        padding: 12px 0;
        border-top: 1px solid #c4cec5;
        color: #53685c;
        font-size: 12px;
        line-height: 1.7;
      }
      .legend strong {
        display: block;
        color: #253c31;
      }
      .phone {
        position: relative;
        width: min(100%, 389px);
        margin: auto;
        background: #0e120d;
        border: 7px solid #253029;
        border-radius: 42px;
        color: #f2f3e6;
        box-shadow:
          0 20px 50px #1f37272b,
          0 0 0 1px #728076;
        overflow: hidden;
      }
      .status {
        height: 27px;
        padding: 5px 23px 0;
        display: flex;
        justify-content: space-between;
        font:
          600 11px Inter,
          Arial,
          sans-serif;
        color: #e9efdd;
      }
      .signals {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .signal {
        width: 12px;
        height: 8px;
        background: linear-gradient(
          to right,
          #d8deca 22%,
          transparent 22% 35%,
          #d8deca 35% 63%,
          transparent 63% 76%,
          #d8deca 76%
        );
        clip-path: polygon(0 80%, 100% 0, 100% 100%, 0 100%);
      }
      .battery {
        width: 15px;
        height: 7px;
        border: 1px solid #cbcfbf;
        border-radius: 2px;
        background: linear-gradient(90deg, #cbcfbf 75%, transparent 75%);
      }
      .display {
        min-height: 609px;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .screen {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 12px 20px 17px;
      }
      .notch {
        margin: 3px auto 7px;
        width: 96px;
        height: 3px;
        border-radius: 9px;
        background: #b8c0a9;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 32px;
      }
      .top span {
        font-size: 12px;
        font-weight: 650;
        color: #d0d6c1;
      }
      .x {
        border: 1px solid #58604b;
        background: #242b20;
        color: #edf1e1;
        border-radius: 50%;
        height: 30px;
        width: 30px;
        font-size: 17px;
        line-height: 1;
      }
      .link {
        border: 0;
        background: none;
        font-size: 12px;
        font-weight: 650;
        color: #e3eea7;
        text-decoration: underline;
        padding: 4px;
      }
      .hero {
        position: relative;
        isolation: isolate;
        min-height: 98px;
        display: flex;
        align-items: center;
        overflow: hidden;
        margin: 7px -2px 6px;
        padding: 10px 13px;
        border: 1px solid #424d30;
        border-radius: 13px;
        background:
          radial-gradient(ellipse at 90% 10%, #5b6635, transparent 56%),
          linear-gradient(120deg, #23291b, #171e13);
      }
      .hero h2 {
        font-size: 32px;
        line-height: 1.05;
        letter-spacing: -0.06em;
        margin: 4px 0;
      }
      .hero small,
      .subline {
        font:
          650 10px Consolas,
          monospace;
        letter-spacing: 0.08em;
        color: #d0dd9e;
      }
      .hero img {
        width: 63px;
        margin-left: auto;
        margin-right: 6px;
        filter: drop-shadow(0 3px 8px #10160c80);
      }
      .features {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 5px;
        font-size: 12px;
        margin: 10px 0 16px;
        color: #e3e8d6;
      }
      .features span:before {
        content: "✓";
        color: var(--lime);
        margin-right: 5px;
        font-weight: 800;
      }
      .smallhead {
        margin: 0 0 9px;
        font-weight: 700;
        font-size: 16px;
      }
      .plans {
        display: grid;
        gap: 7px;
      }
      .plan {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        background: #1c2119;
        border: 1px solid #48513e;
        border-radius: 12px;
        color: #eeefdd;
        padding: 10px 12px;
        text-align: left;
      }
      .plan[aria-pressed="true"] {
        border-color: var(--lime);
        background: #2d3323;
      }
      .radio {
        border: 1px solid #858f74;
        border-radius: 50%;
        width: 15px;
        height: 15px;
        display: grid;
        place-items: center;
        flex: none;
      }
      .plan[aria-pressed="true"] .radio {
        border-color: var(--lime);
      }
      .plan[aria-pressed="true"] .radio:after {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--lime);
      }
      .plan strong,
      .plan small {
        display: block;
      }
      .plan strong {
        font-size: 15px;
      }
      .plan small,
      .muted {
        color: #bac3a9;
        font-size: 11px;
        line-height: 1.5;
      }
      .plan b {
        margin-left: auto;
        font-size: 17px;
        white-space: nowrap;
        color: #f4f6e7;
        text-align: right;
      }
      .plan b small {
        font-weight: 400;
      }
      .offer {
        display: flex;
        gap: 7px;
        align-items: center;
        color: #d4e29d;
        margin: 10px 0 0;
        font-size: 12px;
      }
      .offer input {
        accent-color: var(--lime);
      }
      .terms {
        color: #c3cbb1;
        font-size: 12px;
        line-height: 1.5;
        margin: 12px 0;
      }
      .cta,
      .secondary {
        width: 100%;
        display: block;
        text-align: center;
        border: 0;
        border-radius: 10px;
        padding: 12px;
        font-size: 14px;
        font-weight: 750;
      }
      .cta {
        background: var(--lime);
        color: #1c2312;
      }
      .secondary {
        background: #252e21;
        border: 1px solid #46533c;
        color: #e8efd9;
        margin-top: 8px;
      }
      .cta:disabled {
        background: #555b4b;
        color: #c8ccbb;
        cursor: not-allowed;
      }
      .foot {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin: 8px 0 0;
      }
      .foot .link {
        font-weight: 400;
        color: #bfc6af;
        font-size: 11px;
      }
      .push {
        margin-top: auto;
        padding-top: 11px;
      }
      .tile {
        border-top: 1px solid #373f31;
        padding: 13px 0;
      }
      .tile h3 {
        margin: 0 0 4px;
        font-size: 14px;
      }
      .tile p,
      .profileText {
        margin: 0;
        color: #c1cbb3;
        font-size: 13px;
        line-height: 1.55;
      }
      .stateHead {
        margin: 23px 0 18px;
      }
      .stateHead h2 {
        font-size: 29px;
        letter-spacing: -0.045em;
        margin: 6px 0;
      }
      .message {
        display: block;
        background: #e1ebbe;
        color: #213516;
        font-size: 12px;
        line-height: 1.45;
        border-radius: 7px;
        padding: 8px 10px;
        margin: 4px 0;
      }
      .playSheet {
        background: #f2f4ee;
        color: #1c3124;
        border-radius: 19px;
        padding: 18px;
        margin-top: 20px;
        box-shadow: 0 14px 36px #0005;
      }
      .playSheet h3 {
        margin: 6px 0 15px;
      }
      .playSheet p {
        font-size: 13px;
        line-height: 1.55;
      }
      .playSheet .cta {
        background: #186c42;
        color: white;
      }
      .playSheet .secondary {
        color: #264c34;
        background: #e1e8dd;
        border-color: #c9d4c7;
      }
      .dialogText {
        line-height: 1.55;
        font-size: 14px;
      }
      .sheetScreen {
        padding-top: 8px;
      }
      .backdropLabel {
        display: flex;
        align-items: center;
        gap: 9px;
        border-bottom: 1px solid #393f31;
        padding: 5px 0 10px;
        font-size: 12px;
        color: #bbc5aa;
      }
      .sheetCard {
        background: #20261c;
        padding: 12px;
        border: 1px solid #46513b;
        border-radius: 18px 18px 8px 8px;
        margin: 10px -8px 0;
      }
      .sheetCard .hero {
        min-height: 78px;
      }
      .sheetCard .hero h2 {
        font-size: 26px;
      }
      .sheetCard .features {
        margin-bottom: 10px;
      }
      .sheetCard .hero img {
        width: 46px;
      }
      dialog {
        border: 1px solid #526348;
        color: #eaf0de;
        background: #222c20;
        border-radius: 18px;
        width: min(340px, 90vw);
        padding: 18px;
      }
      dialog::backdrop {
        background: #10180f85;
      }
      dialog h3 {
        margin: 0 0 8px;
      }
      .stamp {
        margin: 0 0 7px;
        text-align: center;
        font-size: 11px;
        color: #647a6b;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 740px) {
        .workspace {
          display: flex;
          flex-direction: column;
          gap: 16px;
          padding: 14px 15px 24px;
        }
        .controls {
          padding: 0;
          width: 100%;
        }
        .controls h1 {
          font-size: 24px;
          margin: 4px 0 8px;
        }
        .controls > .eyebrow,
        .intro,
        .legend {
          display: none;
        }
        .controlbox {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
          padding: 9px;
          border-radius: 10px;
        }
        .field select {
          padding: 6px;
          font-size: 12px;
        }
        .field > span {
          font-size: 11px;
        }
        .reset {
          font-size: 11px;
        }
        .bar {
          min-height: 42px;
          padding: 7px 15px;
        }
        .stage {
          width: 100%;
        }
        .phone {
          width: min(100%, 389px);
          border-width: 4px;
          border-radius: 29px;
        }
        .display {
          min-height: 552px;
        }
        .screen {
          padding-left: 15px;
          padding-right: 15px;
        }
        .hero {
          min-height: 82px;
        }
        .phone .features {
          font-size: 11px;
        }
      }
    </style>
  </head>

    <main class="workspace">
      <aside class="controls">
        <span class="eyebrow">ANDROID / GOOGLE PLAY</span>
        <h1>订阅体验预览</h1>
        <p class="intro">
          在右侧体验同一个 Android 账号购买、恢复和管理 Premium
          的过程。可切换商店结果，观察权益如何变化。
        </p>
        <div class="controlbox">
          <label class="field"
            ><span>用户场景</span
            ><select id="scenario">
              <option value="paywall">新用户 · 订阅页</option>
              <option value="modal">扫描额度用尽 · 弹窗</option>
              <option value="guest">游客 · 首购前登录</option>
              <option value="legacy">免费首版 · 存量用户</option>
              <option value="profile">已购 · 个人中心</option>
              <option value="grace">付款失败 · 宽限期</option>
              <option value="hold">付款失败 · 保留期</option>
              <option value="expired">已到期</option>
              <option value="page-off">订阅页停用 · 查看 Profile</option>
              <option value="modal-off">扫描弹窗停用 · 查看 Scan</option>
              <option value="off">全局停售 · 已购用户</option>
              <option value="unavailable">商店目录暂不可用</option>
            </select></label
          >
          <label class="field"
            ><span>模拟付款结果</span
            ><select id="payment">
              <option value="ok">付款完成并验单</option>
              <option value="pending">等待付款</option>
              <option value="sync">付款完成 · 验单延迟</option>
              <option value="cancel">用户取消付款</option>
            </select></label
          >
          <label class="field"
            ><span>模拟恢复结果</span
            ><select id="recovery">
              <option value="found">找到本 Android 账号的有效订阅</option>
              <option value="empty">当前 Play 账号没有订阅</option>
              <option value="other">购买属于另一 App 账号</option>
              <option value="offline">商店暂时不可达</option>
            </select></label
          ><button class="reset" id="reset">重置演示</button>
        </div>
        <div class="legend">
          <strong>原型使用说明</strong
          >模拟商品、价格和日期仅用于评审。手机内保留产品现有的英文界面风格。页面可通过键盘操作。
        </div>
      </aside>

          <div class="status">

    <script>
      (() => {
        "use strict";
        const $ = (id) => document.getElementById(id);
        const params = new URLSearchParams(location.search);
        const portfolioBenefits = [
          "Unlimited card scanning",
          "More portfolio folders",
          "Track performance",
          "Extended price history",
        ];
        const plans = {
          monthly: { title: "Monthly", price: "US$4.99", unit: "month" },
          yearly: { title: "Yearly", price: "US$39.99", unit: "year" },
        };
        const profileStatus = {
          free: ["Free plan", "Basic scanning and collection tools are available."],
          legacy: [
            "Free access retained",
            "Your Android account keeps its original scanning, folders, performance and price history.",
          ],
          active: ["Premium is active", "Your Google Play subscription is verified."],
          canceled: [
            "Renewal canceled",
            "Premium is available through the end of your paid period.",
          ],
          grace: ["Update your payment method", "You still have Premium during the grace period."],
          hold: ["Payment on hold", "Premium is paused. Fix your payment method in Google Play."],
          expired: ["Subscription expired", "Your collection and existing folders are available."],
          trial: ["Free trial is active", "Your free trial has been verified by Google Play."],
        };
        let screen,
          access,
          signedIn,
          trialEligible,
          trial,
          plan,
          sale,
          catalog,
          origin,
          flash,
          fundedPlan,
          paidUntil,
          unpaidStage,
          pageAvailable,
          modalAvailable;
        function restart(value, fromLink = false) {
          $("scenario").value = value;
          pageAvailable = value !== "page-off";
          modalAvailable = value !== "modal-off";
          origin = value === "modal" || value === "modal-off" ? "scan" : "profile";
          signedIn = value !== "guest";
          trialEligible = true;
          trial = false;
          plan = "monthly";
          fundedPlan = "monthly";
          sale = value !== "off";
          catalog = value !== "unavailable";
          unpaidStage = "";
          paidUntil = value === "grace" ? "Nov 29, 2026" : "Dec 26, 2026";
          flash = "";
          access =
            {
              legacy: "legacy",
              profile: "active",
              off: "active",
              grace: "grace",
              hold: "hold",
              expired: "expired",
            }[value] || "free";
          screen = ["paywall", "guest", "modal", "unavailable"].includes(value)
            ? "paywall"
            : "profile";
          if (value === "modal-off") screen = "scan";
          if (fromLink) {
            plan = params.get("plan") === "yearly" ? "yearly" : "monthly";
            trialEligible = params.get("offer") !== "off";
            if (params.has("page")) pageAvailable = params.get("page") === "on";
            if (params.has("modal")) modalAvailable = params.get("modal") === "on";
          }
          render();
        }
        function button(label, action, style = "secondary", extra = "") {
          return `<button type="button" class="${style}" data-action="${action}" ${extra}>${label}</button>`;
        }
        function screenHeader(label, close = "back") {
          return `<div class="top"><span>${label}</span>${button("×", close, "x", 'aria-label="Close view"')}</div>`;
        }
        function notice() {
          return flash ? `<div class="message" role="status">${flash}</div>` : "";
        }
        function copy() {
          const p = plans[plan];
          return trial && plan === "monthly"
            ? "7 days free, then US$4.99 every month until canceled."
            : `${p.price} every ${p.unit} until canceled.`;
        }
        function paywall() {
          const isModal = origin === "scan";
          const cards = Object.entries(plans)
            .map(
              ([key, v]) =>
                `<button class="plan" data-action="plan-${key}" aria-pressed="${plan === key}"><i class="radio"></i><span><strong>${v.title}</strong><small>Auto-renewing</small></span><b>${v.price}<small>per ${v.unit}</small></b></button>`,

        }
        function profile() {
          const [title, desc] = profileStatus[access];
          const terms = isPaid()
            ? `<div class="tile"><h3>${plans[fundedPlan].title} · Google Play</h3><p>${access === "canceled" ? "Access until" : access === "grace" ? "Grace period ends" : access === "trial" ? "Trial ends" : "Next billing date"} · ${paidUntil}</p></div>`
            : "";
          return `<section class="screen"><div class="top"><span>Profile</span><span>Android</span></div>${notice()}<div class="stateHead"><div class="subline">MY MEMBERSHIP</div><h2>${title}</h2><p class="profileText">${desc}</p></div><div class="tile"><h3>My collection</h3><p>Cards and folders in this Android account</p></div>${terms}${access === "free" || access === "expired" ? '<div class="tile"><h3>Scan allowance</h3><p>10 free scans per new eligible account</p></div>' : ""}<div class="push">${unpaidStage ? button(unpaidStage === "pending" ? "Check pending payment" : "Retry verification", "resume-payment", "cta") : access === "legacy" ? '<p class="terms">Your retained benefits apply to this Android account.</p>' : isPaid() || access === "hold" ? button("Manage in Google Play", "manage", "cta") : sale && pageAvailable ? button("View Premium plans", "view", "cta") : ""}${access !== "legacy" && !unpaidStage ? button("Restore purchases", "restore") : ""}${!pageAvailable && access === "free" ? '<p class="muted">The subscription page is currently closed. You can still restore purchases in Profile.</p>' : ""}${!sale ? '<p class="muted">New purchases are paused. Your existing subscription can still be restored and managed.</p>' : ""}</div></section>`;

        function isPaid() {
          return ["active", "canceled", "grace", "trial"].includes(access);
        }
        function formPage(title, body, actions) {
          return `<section class="screen">${screenHeader("CardScanFox")}${notice()}<div class="stateHead"><h2>${title}</h2><p class="profileText">${body}</p></div><div class="push">${actions}</div></section>`;
        }
        function current() {
          if (screen === "paywall") return paywall();
          if (screen === "profile") return profile();
          if (screen === "confirm")
            return `<section class="screen">${screenHeader("Return to app", "return-offer")}<div class="playSheet"><div class="mono">GOOGLE PLAY · DEMO</div><h3>Confirm subscription</h3><p><b>CardScanFox Premium · ${plans[plan].title}</b></p><p>${copy()}</p><p>Payment is managed by your Google Play account.</p>${button("Confirm demo purchase", "pay", "cta")}${button("Cancel", "return-offer")}</div></section>`;
          if (screen === "login")
            return formPage(
              "Sign in to CardScanFox",
              "Link this purchase to your Android CardScanFox account so you can restore it on another device.",
              button("Continue with demo account", "login", "cta"),

          if (screen === "pending")
            return formPage(
              "Waiting for payment",
              "Google Play is still processing your purchase. You can safely return to the app.",
              button("Simulate payment completed", "settle", "cta") +
                button("Back to profile", "dismiss-pending"),

          if (screen === "sync")

              button("Retry verification", "settle", "cta") +
                button("Back to profile", "dismiss-pending"),
            );

          if (screen === "scan")
            return formPage(
              "Free scan limit reached",
              "Your current Android account has used its 10 free scans. Your previous scans and collection are available.",

                button("Back to profile", "to-profile"),
            );
          return "";
        }
        function render() {
          $("display").innerHTML = current();
        }
        function info(title, body) {
          $("infoTitle").textContent = title;
          $("infoBody").textContent = body;
          $("info").showModal();

        function settle() {
          unpaidStage = "";
          access = trial && plan === "monthly" ? "trial" : "active";

          screen = "profile";
          flash = "Purchase verified. Premium is ready to use.";

        function act(action) {
          flash = "";
          if (action.startsWith("plan-")) {
            plan = action.slice(5);
            trial = false;

            switch (action) {
              case "checkout":
                screen = signedIn ? "confirm" : "login";

              case "login":

                screen = "paywall";
                flash = "Signed in. Review your plan to continue.";
                break;
              case "pay": {
                const state = $("payment").value;
                if (state === "ok") settle();
                else if (state === "cancel") {
                  screen = "paywall";
                  flash = "Purchase canceled. You were not charged.";
                } else {
                  unpaidStage = state;
                  screen = state;
                }
                break;
              }
              case "settle":
                settle();
                break;
              case "resume-payment":
                screen = unpaidStage;
                break;
              case "dismiss-pending": {
                const delay = screen;
                screen = "profile";
                flash =
                  delay === "sync"

                    : "Payment is pending. Check its progress before starting another purchase.";
                break;
              }
              case "restore": {
                if (!signedIn) {
                  info(
                    "Sign in to restore",
                    "Use the CardScanFox Android account originally linked to your purchase.",
                  );
                  return;

                const result = $("recovery").value;
                if (result === "found") {
                  if (!isPaid() && access !== "hold") access = "active";
                  screen = "profile";
                  flash = "Subscription restored for this Android account.";

                  flash = {
                    empty: "No active subscription found. Check your Google Play account.",
                    other:
                      "This purchase belongs to another CardScanFox account. Sign in to the original account or contact Support.",
                    offline:
                      "Could not reach Google Play. Check your connection and try Restore again.",
                  }[result];
                break;
              }
              case "manage":
                screen = "manage";
                break;
              case "cancel-renewal":
                access = "canceled";
                screen = "profile";
                flash = "Renewal canceled in Google Play. You keep access until expiry.";
                break;
              case "fix":
                if (access === "hold" || access === "grace") paidUntil = "Dec 26, 2026";
                access = "active";
                screen = "profile";
                flash = "Subscription status updated from Google Play.";
                break;
              case "view":
                if (!sale) return;
                screen = "paywall";
                break;
              case "back":
                screen = screen === "paywall" && origin === "scan" ? "scan" : "profile";
                break;
              case "to-profile":
                origin = "profile";
                screen = "profile";
                break;
              case "return-offer":
                screen = "paywall";
                break;
              case "refresh":
                catalog = true;
                trialEligible = false;
                trial = false;
                flash = "Prices refreshed. Review the available plans again.";
                break;
              case "terms":
                info(
                  "Subscription terms",
                  "Prices and dates are examples. Google Play charges the displayed recurring price. Manage or cancel renewal in Google Play.",
                );
                return;
              case "privacy":
                info(
                  "Purchase privacy",
                  "CardScanFox uses purchase and Android account information to verify, restore and support your subscription.",
                );
                return;
            }
          render();
        }
        $("display").addEventListener("click", (e) => {
          const target = e.target.closest("[data-action]");
          if (target) act(target.dataset.action);
        });
        $("display").addEventListener("change", (e) => {
          if (e.target.id === "trial") {
            trial = e.target.checked;
            render();
            document.getElementById("trial")?.focus();
          }
        });
        $("scenario").onchange = () => restart($("scenario").value);
        $("reset").onclick = () => {
          $("payment").value = "ok";
          $("recovery").value = "found";
          restart("paywall");
        };
        $("dismiss").onclick = () => $("info").close();
        const initial = params.get("entry");
        restart(
          ["modal", "profile", "page-off", "modal-off", "off", "unavailable"].includes(initial)
            ? initial
            : "paywall",
          true,
        );
      })();
