<!doctype html>
<html lang="zh-CN">
  <head>
    <!-- 离线评审使用仓库内既有资源 apps/flutter-app/assets/branding/card_ai_mark.svg。 -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TCG Admin · Google Play 订阅运营</title>
    <style>
      :root {
        font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
        background: #f3f6f7;
        color: #172b34;
        --nav: #14212f;
        --teal: #087c85;
        --line: #dce4e7;
        --gray: #546976;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a,
      select {
        touch-action: manipulation;
      }
      button,
      a {
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #1299a5;
        outline-offset: 2px;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.56;
      }
      button {
        color: inherit;
      }
      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 188px minmax(0, 1fr);
      }
      aside {
        background: var(--nav);
        color: #dce6eb;
        padding: 24px 12px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 4px;
      }
      .brand img {
        width: 30px;
        height: 30px;
      }
      .brand strong,
      .brand small {
        display: block;
      }
      .brand strong {
        font-size: 18px;
        letter-spacing: -0.035em;
      }
      .brand small {
        color: #9cb1c1;
        font-size: 10px;
      }
      .navgroup h2 {
        font-size: 11px;
        color: #9fb2c1;
        margin: 16px 9px 7px;
        font-weight: 650;
      }
      .navgroup button {
        width: 100%;
        text-align: left;
        background: transparent;
        border: 0;
        border-radius: 6px;
        color: #d6e0e6;
        padding: 9px 10px;
        font-size: 13px;
        margin: 2px 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .navgroup button.active {
        background: #283d4b;
        color: white;
        box-shadow: inset 3px 0 #45c6ce;
      }
      .navgroup svg {
        width: 15px;
        height: 15px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.6;
      }
      .account {
        padding: 12px 5px 0;
        margin-top: auto;
        border-top: 1px solid #3b4c59;
      }
      .account label {
        display: grid;
        gap: 7px;
        font-size: 11px;
        color: #b9c9d3;
      }
      .account select {
        color: #e1ecee;
        background: #213340;
        border-color: #435764;
      }
      .content {
        min-width: 0;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px clamp(16px, 3vw, 43px);
        min-height: 54px;
        background: white;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        color: var(--gray);
      }
      .topbar a {
        color: var(--teal);
        font-size: 13px;
        font-weight: 650;
        text-decoration: none;
      }
      .main {
        max-width: 1520px;
        margin: auto;
        padding: 25px clamp(15px, 3.1vw, 48px) 40px;
      }
      .topline,
      .split,
      .opbar,
      .chips,
      .toolbar,
      .tabs,
      .keyline {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .topline,
      .split,
      .opbar {
        justify-content: space-between;
      }
      .topline {
        align-items: flex-end;
        margin-bottom: 16px;
      }
      .lead {
        margin: 0;
        color: #657882;
        font-size: 13px;
        line-height: 1.6;
      }
      .scope {
        margin: 0 0 5px;
        font:
          650 11px Consolas,
          monospace;
        color: #376773;
        letter-spacing: 0.035em;
      }
      h1 {
        font-size: clamp(26px, 2.4vw, 36px);
        letter-spacing: -0.05em;
        line-height: 1.17;
        margin: 4px 0 8px;
      }
      h2,
      h3 {
        margin: 0;
        letter-spacing: -0.025em;
      }
      h2 {
        font-size: 17px;
      }
      h3 {
        font-size: 15px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border-radius: 5px;
        white-space: nowrap;
        padding: 3px 7px;
        font-size: 11px;
        background: #e8eff2;
        color: #3e5967;
      }
      .badge.good {
        background: #dbf2e9;
        color: #116143;
      }
      .badge.warn {
        background: #fff0d7;
        color: #805415;
      }
      .badge.bad {
        background: #fee5e3;
        color: #9b332e;
      }
      .badge.info {
        background: #e2f1f6;
        color: #1b657d;
      }
      .btn,
      .tabs button {
        border: 1px solid #c9d5da;
        background: white;
        border-radius: 6px;
        padding: 7px 12px;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
      }
      .btn.primary {
        background: #136d76;
        color: white;
        border-color: #136d76;
      }
      .btn.text {
        padding: 3px 1px;
        border: 0;
        background: none;
        color: var(--teal);
        font-weight: 650;
        text-decoration: none;
      }
      .btn.danger {
        color: #993c31;
      }
      .tabs {
        gap: 4px;
        display: inline-flex;
        background: #e4ebee;
        padding: 4px;
        border-radius: 8px;
      }
      .tabs button {
        border: 0;
        background: transparent;
        color: #516876;
      }
      .tabs button[aria-pressed="true"] {
        color: #143640;
        background: white;
        box-shadow: 0 1px 4px #192f3a1a;
      }
      .paper {
        background: white;
        border: 1px solid var(--line);
        border-radius: 12px;
        margin: 14px 0;
        padding: 17px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin: 15px 0;
      }
      .metric {
        background: white;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px;
      }
      .metric > span,
      .metric small {
        display: block;
        font-size: 12px;
        color: var(--gray);
      }
      .metric b {
        display: block;
        font-size: clamp(20px, 2.3vw, 32px);
        font-weight: 650;
        letter-spacing: -0.055em;
        margin: 6px 0 2px;
        font-variant-numeric: tabular-nums;
      }
      .metric.net {
        border-color: #92c8c7;
        background: #f1f9f7;
      }
      .sub {
        font-size: 12px;
        color: var(--gray);
        line-height: 1.6;
      }
      .filters,
      .cfgform {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(126px, 1fr));
        gap: 12px;
        align-items: end;
      }
      .filters {
        margin: 0 0 13px;
      }
      .field {
        display: grid;
        gap: 5px;
        min-width: 0;
        font-size: 12px;
        color: #4c6470;
        font-weight: 650;
      }
      select,
      input {
        min-width: 0;
        width: 100%;
        border: 1px solid #c6d4da;
        border-radius: 6px;
        background: white;
        padding: 7px 8px;
        color: #263c47;
        font-size: 13px;
      }
      .toolbar {
        flex-wrap: wrap;
      }
      .tablewrap {
        max-width: 100%;
        overflow-x: auto;
        margin: 11px -2px 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        white-space: nowrap;
      }
      th,
      td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid #e4ebed;
      }
      th {
        background: #f3f6f7;
        color: #536a77;
        font-size: 11px;
      }
      td small {
        display: block;
        color: #697d88;
        font-size: 11px;
      }
      .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .mono {
        font-family: "IBM Plex Mono", Consolas, monospace;
      }
      .empty {
        text-align: center;
        padding: 28px;
        color: #687c86;
      }
      .hint,
      .toast {
        border-left: 3px solid #36a5a6;
        border-radius: 4px;
        background: #edf6f5;
        padding: 9px 12px;
        font-size: 12px;
        line-height: 1.55;
        color: #375f60;
      }
      .toast {
        margin: 10px 0;
        border-color: #4d9273;
        background: #eaf6ed;
        color: #245f41;
      }
      .hint.warn {
        background: #fff5e7;
        border-color: #c88b37;
        color: #775322;
      }
      .tabspace {
        margin: 12px 0;
      }
      .opbar {
        flex-wrap: wrap;
        gap: 10px;
      }
      .opbar .toolbar a {
        display: inline-block;
      }
      .smallgrid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 15px;
      }
      .kv {
        display: grid;
        grid-template-columns: minmax(85px, 0.6fr) minmax(0, 1.4fr);
        gap: 9px 12px;
        font-size: 13px;
        margin: 12px 0;
      }
      .kv dt {
        color: #5d7380;
      }
      .kv dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .cfgform {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin: 13px 0;
      }
      .cfgform input[type="checkbox"] {
        width: auto;
        accent-color: var(--teal);
      }
      .check {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 13px;
      }
      .footnote {
        font-size: 11px;
        line-height: 1.5;
        color: #697c86;
        margin: 12px 0 0;
      }
      dialog {
        width: min(490px, 94vw);
        max-height: 88vh;
        overflow: auto;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 14px;
        color: #1e3139;
        box-shadow: 0 24px 90px #10282b35;
      }
      dialog::backdrop {
        background: #0d24355c;
      }
      .dhead,
      .dbody {
        padding: 17px 20px;
      }
      .dhead {
        position: sticky;
        top: 0;
        background: white;
        border-bottom: 1px solid var(--line);
        z-index: 1;
        display: flex;
        gap: 9px;
        align-items: center;
        justify-content: space-between;
      }
      .timeline {
        list-style: none;
        margin: 12px 0;
        padding: 0;
        border-left: 2px solid #b2cdce;
      }
      .timeline li {
        padding: 0 0 12px 12px;
        font-size: 13px;
      }
      .timeline li small {
        display: block;
        color: #627983;
      }
      .ios {
        padding: 22px;
      }
      .ios p {
        line-height: 1.65;
      }
      .navgroup button:hover,
      .btn:hover:not(:disabled) {
        filter: brightness(0.96);
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 900px) {
        .app {
          grid-template-columns: 150px minmax(0, 1fr);
        }
        aside {
          padding: 18px 8px;
        }
        .cards {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .topline {
          align-items: flex-start;
        }
        .smallgrid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 650px) {
        .app {
          display: block;
        }
        aside {
          display: grid;
          grid-template-columns: 1fr auto;
          gap: 5px;
          padding: 9px 12px;
        }
        .brand small,
        .navgroup h2 {
          display: none;
        }
        .brand img {
          width: 23px;
          height: 23px;
        }
        .brand strong {
          font-size: 15px;
        }
        .account {
          grid-area: 1/2;
          margin: 0;
          border: 0;
          padding: 0;
        }
        .account label {
          display: block;
          font-size: 0;
        }
        .account select {
          font-size: 11px;
          padding: 4px;
        }
        .navgroup {
          grid-column: 1/-1;
          display: flex;
          overflow: auto;
          gap: 5px;
        }
        .navgroup button {
          width: auto;
          white-space: nowrap;
          font-size: 12px;
          padding: 7px;
        }
        .navgroup button svg {
          display: none;
        }
        .topbar {
          min-height: 34px;
          padding: 5px 13px;
        }
        .main {
          padding: 13px 12px 25px;
        }
        .topline {
          display: block;
        }
        .topline .tabs {
          margin-top: 8px;
        }
        .cards {
          margin: 10px 0;
          gap: 7px;
        }
        .metric {
          padding: 9px;
        }
        .paper {
          padding: 12px;
          margin: 9px 0;
        }
        .filters,
        .cfgform {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
        }
        .split {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>

        const select = (id, pairs, value) => `<select id="${id}">${options(pairs, value)}</select>`;
        const title = (text, description, tabs = "") =>
          `<div class="topline"><div><p class="scope">${store === "ios" ? "APP STORE" : "GOOGLE PLAY"} &nbsp; / &nbsp; com.cardai.tcg</p><h1>${text}</h1><p class="lead">${description}</p></div>${tabs}</div>`;
        const tabs = () =>
          `<div class="tabs" aria-label="商店"><button data-action="store-ios" aria-pressed="${store === "ios"}">iOS</button><button data-action="store-google" aria-pressed="${store === "google"}">Google Play</button></div>`;
        const alertBox = () =>
          notice ? `<div class="toast" role="status">${esc(notice)}</div>` : "";
        function eventsFor(order) {
          return order.events.filter(
            (e) =>
              (!orderFilter.from || e[0] >= orderFilter.from) &&
              (!orderFilter.to || e[0] <= orderFilter.to) &&
              (orderFilter.kind === "all" || e[1] === orderFilter.kind),
          );
        }
        function rows() {
          return sampleOrders
            .filter(
              (o) =>
                (orderFilter.env === "all" || o.env === orderFilter.env) &&
                (orderFilter.plan === "all" || o.plan === orderFilter.plan) &&
                [o.id, o.uid, o.zone].some((v) =>
                  v.toLowerCase().includes(orderFilter.q.toLowerCase()),
                ),
            )
            .map((o) => ({ o, events: eventsFor(o) }))
            .filter((r) => r.events.length);
        }
        function summarize(events, kind) {
          const items = events.filter((e) => e[1] === kind),
            known = items.filter((e) => e[2] !== null);
          return {
            value: known.length || !items.length ? known.reduce((s, e) => s + e[2], 0) : null,
            missing: items.length - known.length,
            count: items.length,
          };
        }
        function orders() {
          const list = rows(),
            events = list.flatMap((x) => x.events),
            charges = summarize(events, "charge"),
            refunds = summarize(events, "refund");
          const net =
            charges.value === null || refunds.value === null ? null : charges.value - refunds.value;
          const metric = (label, val, note, cls = "") =>
            `<div class="metric ${cls}"><span>${label}</span><b>${val}</b><small>${note}</small></div>`;
          const filters = `<form id="orderForm"><div class="filters">${field("订单号 / UID / 地区", `<input id="orderQ" value="${esc(orderFilter.q)}" placeholder="订单号、UID 或地区">`)}${field(
            "交易类型",
            select(
              "orderEnv",
              [
                ["live", "正式购买"],
                ["test", "测试购买"],
              ],
              orderFilter.env,
            ),
          )}${field(
            "基础方案",
            select(
              "orderPlan",
              [
                ["all", "全部方案"],
                ["monthly", "月付"],
                ["yearly", "年付"],
              ],
              orderFilter.plan,
            ),
          )}${field(
            "资金事件",
            select(
              "orderKind",
              [
                ["all", "全部"],
                ["charge", "扣款"],
                ["refund", "退款"],
              ],
              orderFilter.kind,
            ),
          )}${field("起始日期（UTC）", `<input type="date" id="orderFrom" value="${orderFilter.from}">`)}${field("结束日期（含）", `<input type="date" id="orderTo" value="${orderFilter.to}">`)}</div><div class="toolbar"><button class="btn primary" type="submit">查询</button>${btn("重置", "orders-reset")}</div></form>`;
          return (
            title("订单统计", "按资金实际发生时间查看扣款和退款，金额统一折算为美元。", tabs()) +
            alertBox() +
            `<div class="cards">${metric("成功扣款 · USD", money(charges.value), `${charges.count} 笔扣款 · ${charges.missing} 笔缺金额`)}${metric("成功退款 · USD", money(refunds.value), `${refunds.count} 笔退款 · ${refunds.missing} 笔缺金额`)}${metric("已知净额 · USD", money(net), "扣款减退款", "net")}${metric("区间订单数", list.length, "完整订单号去重")}</div><section class="paper">${filters}</section><section class="paper"><div class="opbar"><div><h2>订单明细</h2><span class="sub">production · ${envNames[orderFilter.env]} · UTC+0</span></div>${btn("导出示例 CSV", "export", list.length ? "" : "disabled")}</div><div class="tablewrap"><table><thead><tr><th>订单 / UID</th><th>方案</th><th>国家</th><th>订单类型</th><th>权益 / 续订</th><th class="num">区间扣款</th><th class="num">区间退款</th><th>操作</th></tr></thead><tbody>${
              list
                .map(({ o, events }) => {
                  const c = summarize(events, "charge"),
                    r = summarize(events, "refund");
                  return `<tr><td class="mono">${o.id}<small>${o.uid}</small></td><td>${o.plan}</td><td>${o.zone}</td><td>${o.kind}</td><td>${badge(o.access, "good")}<small>${o.renew}</small></td><td class="num">${money(c.value)}${c.missing ? "<small>待对账</small>" : ""}</td><td class="num">${money(r.value)}</td><td><button class="btn text" data-action="order-${o.id}">详情</button></td></tr>`;
                })
                .join("") || '<tr><td colspan="8" class="empty">没有符合条件的订单</td></tr>'
            }</tbody></table></div><p class="footnote">金额仅汇总已核实的 USD。正式后台沿用 XLSX，离线原型导出当前筛选的 CSV。图中订单为演示数据。</p></section>`
          );
        }
        function notificationPage() {
          const list = messages.filter(
            (m) =>
              (msgFilter.env === "all" || m.env === msgFilter.env) &&
              (msgFilter.result === "all" || m.status === msgFilter.result) &&
              [m.id, m.type, m.order].some((x) =>
                x.toLowerCase().includes(msgFilter.q.toLowerCase()),
              ),
          );
          return (
            title("Google Play 通知", "查询商店事件、验单结果、确认进度和需要补查的消息。") +
            alertBox() +
            `<section class="paper"><form id="msgForm"><div class="filters">${field("消息 / 类型 / 订单", `<input id="msgQ" value="${esc(msgFilter.q)}" placeholder="messageId 或订单号">`)}${field(
              "处理状态",
              select(
                "msgResult",
                [
                  ["all", "全部"],
                  ["待重试", "待重试"],
                  ["已处理", "已处理"],
                  ["连通测试", "连通测试"],
                ],
                msgFilter.result,
              ),
            )}${field("来源", select("msgEnv", [["all", "全部来源"], ...Object.entries(envNames)], msgFilter.env))}<button type="submit" class="btn primary">查询通知</button></div></form></section><section class="paper"><div class="opbar"><h2>通知消息列表</h2>${badge(`待重试 ${messages.filter((m) => m.status === "待重试").length} 条`, "warn")}</div><div class="tablewrap"><table><thead><tr><th>messageId</th><th>事件类型</th><th>收到（UTC）</th><th>来源</th><th>状态</th><th>尝试</th><th>操作</th></tr></thead><tbody>${list.map((m) => `<tr><td class="mono">${m.id}</td><td class="mono">${m.type}</td><td>${m.date}</td><td>${envNames[m.env]}</td><td>${badge(m.status, m.status === "待重试" ? "warn" : "good")}</td><td>${m.tries}</td><td><button class="btn text" data-action="msg-${m.id}">详情</button></td></tr>`).join("") || '<tr><td class="empty" colspan="7">没有符合条件的消息</td></tr>'}</tbody></table></div></section>`
          );
        }
        function configPage() {
          const cfg = placements[place],
            trialItem = catalog.find((p) => p.key === "trial");
          const url = (state, enabled = true) =>
            `app.html?entry=${enabled ? place : place + "-off"}&plan=${state.plan}&offer=${state.trial ? "on" : "off"}&page=${(place === "page" ? enabled : placements.page.active) ? "on" : "off"}&modal=${(place === "modal" ? enabled : placements.modal.active) ? "on" : "off"}`;
          const productRows = catalog
            .map(
              (p) =>
                `<tr><td>${p.label}</td><td class="mono">premium / ${p.base}</td><td class="mono">${p.offer}</td><td>${badge(p.approved ? "已准入" : "待审批", p.approved ? "good" : "warn")}</td><td>${p.approved ? "—" : btn("审批准入", "admit-dialog", $("role").value === "super_admin" ? "" : "disabled")}</td></tr>`,
            )
            .join("");
          const current = cfg.active
            ? `${cfg.active.plan} · ${cfg.active.trial ? "可展示合资格试用" : "标准方案"} · r${cfg.active.revision}`
            : "该位置已停用";
          return (
            title(
              "订阅配置",
              "管理两个订阅入口的展示内容；商店价格与试用资格由 Google Play 提供。",
              tabs(),
            ) +
            alertBox() +
            `<section class="paper"><div class="opbar"><div><h2>商品目录与准入</h2><span class="sub">production · google_play · com.cardai.tcg</span></div>${badge("演示目录", "info")}</div><div class="tablewrap"><table><thead><tr><th>名称</th><th>商品 / 基础方案</th><th>优惠 ID</th><th>业务准入</th><th>操作</th></tr></thead><tbody>${productRows}</tbody></table></div><p class="footnote">运营管理员可使用已批准的商品。超级管理员可以审批候选商品及收入事件。</p></section>
 <section class="paper"><div class="opbar"><h2>展示配置</h2><div class="tabs"><button data-action="place-page" aria-pressed="${place === "page"}">订阅页 Page</button><button data-action="place-modal" aria-pressed="${place === "modal"}">弹窗 Modal</button></div></div><div class="smallgrid"><div><h3 style="margin-top:16px">${cfg.name} · 草稿 r${cfg.revision}</h3><form id="cfgForm"><div class="cfgform">${field(
   "默认方案",
   select(
     "cfgPlan",
     [
       ["monthly", "月付"],
       ["yearly", "年付"],
     ],
     cfg.draft.plan,
   ),
 )}${field("优惠展示", `<span class="check"><input id="cfgTrial" type="checkbox" ${cfg.draft.trial ? "checked" : ""} ${!trialItem.approved ? "disabled" : ""}> 合资格月付试用</span>`)}</div><div class="toolbar"><button type="submit" class="btn primary">保存草稿</button><a class="btn" target="_blank" rel="noopener" href="${url(cfg.draft)}">预览已存草稿 ↗</a></div></form></div><div><h3 style="margin-top:16px">当前生效</h3><p class="sub">${current}</p><div class="toolbar">${btn("启用已存草稿", "activate")}${btn("停用此位置", "deactivate", cfg.active ? "" : "disabled")}<a class="btn text" target="_blank" rel="noopener" href="${url(cfg.active || cfg.draft, !!cfg.active)}">查看用户端 ↗</a></div></div></div><p class="hint">停用一个展示位置后，已购用户仍可从 Profile 恢复和管理订阅。</p></section><section class="paper"><h2>配置操作记录</h2>${cfg.log.length ? `<ul class="timeline">${cfg.log.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : '<p class="sub">该位置尚无本次演示操作。</p>'}</section>`
          );
        }
        function iosPane() {
          const descriptions = {
            orders: [
              "iOS 订单统计",
              "按原 Apple SKU、交易环境和通知订单口径筛选，按现有 XLSX 字段导出。",
            ],
            config: [
              "iOS 订阅配置",
              "Apple 商品审批、长期 Restore 注册表、订阅页和订阅大弹窗按现有配置运行。",
            ],
            apple: [
              "苹果通知消息",
              "查看和筛选 Apple App Store Server Notifications V2，按 Apple 通知 UUID 查询详情。",
            ],
          };
          const [heading, body] = descriptions[view];
          return (
            title(
              heading,
              "现有业务入口 · 原型中仅展示兼容范围。",
              view === "apple" ? "" : tabs(),
            ) +
            `<section class="paper ios"><h2>${heading}</h2><p>${body}</p><span class="sub">本页没有连接生产数据。</span></section>`
          );
        }
        function render() {
          $("crumb").textContent = viewNames[view];
          document.querySelectorAll("[data-view]").forEach((el) => {
            el.classList.toggle("active", el.dataset.view === view);
            if (el.dataset.view === view) el.setAttribute("aria-current", "page");
            else el.removeAttribute("aria-current");
          });
          $("main").innerHTML =
            store === "ios"
              ? iosPane()
              : view === "orders"
                ? orders()
                : view === "config"
                  ? configPage()
                  : notificationPage();
        }
        function drawer(title, body) {
          $("drawerTitle").textContent = title;
          $("drawerBody").innerHTML = body;
          if (!$("drawer").open) $("drawer").showModal();
        }
        function closeDrawer() {
          if ($("drawer").open) $("drawer").close();
        }
        function facts(data) {
          return `<dl class="kv">${Object.entries(data)
            .map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`)
            .join("")}</dl>`;
        }
        function showOrder(id) {
          const o = sampleOrders.find((x) => x.id === id);
          if (!o) return;
          drawer(
            "订单详情",
            facts({
              订单号: o.id,
              "业务环境 / 商店": "production / Google Play",
              交易类型: envNames[o.env],
              "Android UID": o.uid,
              "商品 / 基础方案": `premium / ${o.plan}`,
              "权益 / 自动续订": `${o.access} / ${o.renew}`,
              核算来源: "Google Play Orders API · 模拟回查",
              汇率来源:
                o.zone === "加拿大" ? "原币已知，USD 汇率待对账" : "USD / USD = 1，总额含税",
            }) +
              `<h3>区间资金明细</h3><ul class="timeline">${(eventsFor(o).length ? eventsFor(o) : []).map((e) => `<li>${e[1] === "charge" ? "成功扣款" : "成功退款"} · ${e[3]}<small>${e[0]} UTC · ${e[2] === null ? "待对账" : money(e[2])}</small></li>`).join("") || "<li>当前筛选范围内没有资金事件</li>"}</ul>${btn("查看关联通知 " + o.notice, "msg-" + o.notice)}`,
          );
        }
        function showMessage(id) {
          const m = messages.find((x) => x.id === id);
          if (!m) return;
          drawerMessage = id;
          drawer(
            "Google Play 通知详情",
            facts({
              messageId: m.id,
              package: "com.cardai.tcg",
              事件类型: m.type,
              "收到 / UTC": m.date,
              处理结果: m.status,
              来源: envNames[m.env],
              回查尝试: m.tries,
              购买链: m.env === "probe" ? "—" : "仅显示脱敏关联 ID",
              后续处理: m.status === "待重试" ? "等待定时重试，超级管理员也可立即补查" : "无待办",
            }) +
              `<p class="hint ${m.status === "待重试" ? "warn" : ""}">${esc(m.explain)}</p><div class="toolbar">${m.order ? btn("查看关联订单", "order-" + m.order) : ""}${m.status === "待重试" ? btn("重试回查", "retry", $("role").value === "super_admin" ? "primary" : "disabled") : ""}</div>`,
          );
        }
        function csv() {
          const list = rows();
          if (!list.length) return;
          const header = [
            "订单号",
            "Android UID",
            "国家",
            "方案",
            "来源",
            "UTC 日期",
            "资金事件",
            "原币金额",
            "美元金额",
            "对账",
          ];
          const values = list.flatMap(({ o, events }) =>
            events.map((e) => [
              o.id,
              o.uid,
              o.zone,
              o.plan,
              envNames[o.env],
              e[0],
              e[1] === "charge" ? "扣款" : "退款",
              e[3],
              e[2] === null ? "" : (e[2] / 100).toFixed(2),
              e[2] === null ? "待对账" : "已核实",
            ]),
          );
          const contents = [header, ...values]
            .map((line) => line.map((v) => '"' + String(v).replaceAll('"', '""') + '"').join(","))
            .join("\r\n");
          const url = URL.createObjectURL(
              new Blob(["\ufeff", contents], { type: "text/csv;charset=utf-8" }),
            ),
            a = document.createElement("a");
          a.href = url;
          a.download = "Google-Play-订单示例.csv";
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 2500);
          notice = `已导出 ${list.length} 个订单的 ${values.length} 条资金明细。`;
          render();
        }
        function cfgLog(text) {
          const cfg = placements[place];
          cfg.log.unshift(`${$("role").selectedOptions[0].text} · ${text}`);
          notice = text;
        }
        function approve() {
          if ($("role").value !== "super_admin") return;
          const input = $("eventName");
          if (!input.reportValidity()) return;
          const name = input.value;
          catalog.find((p) => p.key === "trial").approved = true;
          cfgLog(`已准入 premium / monthly / intro-7d，收入事件 ${name}。`);
          closeDrawer();
          render();
        }
        function act(a) {
          if (a.startsWith("order-")) return showOrder(a.slice(6));
          if (a.startsWith("msg-")) return showMessage(a.slice(4));
          if (a.startsWith("store-")) {
            store = a.slice(6);
            notice = "";
            return render();
          }
          if (a.startsWith("place-")) {
            place = a.slice(6);
            notice = "";
            return render();
          }
          switch (a) {
            case "orders-reset":
              orderFilter = { ...periodDefault };
              notice = "";
              return render();
            case "export":
              return csv();
            case "admit-dialog":
              if ($("role").value === "super_admin")
                drawer(
                  "审批 Google Play 商品",
                  facts({
                    目标: "production / google_play / com.cardai.tcg",
                    "商品 / 基础方案 / 优惠": "premium / monthly / intro-7d",
                    权益: "performance_pro",
                  }) +
                    field(
                      "Singular 收入事件名",
                      '<input id="eventName" value="gp_monthly_intro" required pattern="[A-Za-z][A-Za-z0-9_]{0,31}" maxlength="32">',
                    ) +
                    '<p class="sub">批准后供运营配置展示，真实交易仍需 Google 验证。</p>' +
                    btn("确认准入", "approve", "primary"),
                );
              return;
            case "approve":
              return approve();
            case "activate": {
              const c = placements[place];
              if (c.active?.revision === c.revision) {
                notice = "该草稿版本已生效。";
              } else {
                c.active = { ...c.draft, revision: c.revision };
                cfgLog(`已将 ${c.name} 草稿 r${c.revision} 设为生效。`);
              }
              return render();
            }
            case "deactivate": {
              const c = placements[place];
              c.active = null;
              cfgLog(`已停用${c.name}，保留长期商品准入和购买恢复。`);
              return render();
            }
            case "retry": {
              if ($("role").value !== "super_admin") return;
              const m = messages.find((x) => x.id === drawerMessage);
              if (!m || m.status !== "待重试") return;
              m.tries++;
              m.status = "已处理";
              m.env = "live";
              m.order = "GPA.DEMO-1002";
              m.explain = "再次按当前商店快照核对，关联已有续费订单。资金明细保持原有一笔。";
              notice = "回查成功，续费订单已存在。";
              render();
              return showMessage(m.id);
            }
          }
        }
        document.addEventListener("click", (e) => {
          const n = e.target.closest("[data-view]");
          if (n) {
            view = n.dataset.view;
            store = view === "apple" ? "ios" : "google";
            notice = "";
            render();
            return;
          }
          const el = e.target.closest("[data-action]");
          if (el && !el.disabled) act(el.dataset.action);
        });
        document.addEventListener("submit", (e) => {
          e.preventDefault();
          notice = "";
          if (e.target.id === "orderForm") {
            const from = $("orderFrom").value,
              to = $("orderTo").value;
            if (from && to && from > to) {
              $("orderTo").setCustomValidity("结束日期须晚于或等于起始日期。");
              $("orderTo").reportValidity();
              return;
            }
            orderFilter = {
              from,
              to,
              q: $("orderQ").value.trim(),
              env: $("orderEnv").value,
              plan: $("orderPlan").value,
              kind: $("orderKind").value,
            };
          }
          if (e.target.id === "msgForm")
            msgFilter = {
              q: $("msgQ").value.trim(),
              env: $("msgEnv").value,
              result: $("msgResult").value,
            };
          if (e.target.id === "cfgForm") {
            const c = placements[place],
              next = {
                plan: $("cfgPlan").value,
                trial: !$("cfgTrial").disabled && $("cfgTrial").checked,
              };
            if (next.plan === c.draft.plan && next.trial === c.draft.trial)
              notice = "草稿内容与已存版本一致。";
            else {
              c.draft = next;
              c.revision++;
              cfgLog(`已保存${c.name}草稿 r${c.revision}。`);
            }
          }
          render();
        });
        document.addEventListener("input", (e) => {
          if (e.target.id === "orderFrom" || e.target.id === "orderTo")
            $("orderTo").setCustomValidity("");
        });
        $("close").onclick = closeDrawer;
        $("role").onchange = () => {
          closeDrawer();
          notice = "";
          render();
        };
        render();
      })();
    </script>
  </body>
</html>
